<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歌日記</title>
<style>
:root{--bg:#e8ecf3;--fg:#1d2236;--sub:#5d6478;--card:#f8f9fc;--line:#c5ccdc;--gold:#a8802a;--link:#2f4a9a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--fg:#e6e8f2;--sub:#9aa2bd;--card:#171b30;--line:#2c3252;--gold:#d9b45a;--link:#a9bbff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1120;--fg:#e6e8f2;--sub:#9aa2bd;--card:#171b30;--line:#2c3252;--gold:#d9b45a;--link:#a9bbff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;line-height:1.8;min-height:100%}
main{max-width:420px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.15rem;font-weight:600;letter-spacing:.12em;margin:0 0 4px}
.sub{color:var(--sub);font-size:.85rem;margin:0 0 14px}
.stage{position:relative;border-radius:6px;overflow:hidden;background:#141a3a;touch-action:none}
canvas{display:block;width:100%;height:auto}
.hud{display:flex;justify-content:space-between;font-size:.85rem;color:var(--sub);margin:8px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 18px;margin-top:14px}
.card p{margin:0 0 12px}
.poem{display:block;font-size:1.25rem;letter-spacing:.08em;color:var(--link);margin:6px 0 4px;text-decoration:underline;text-underline-offset:6px}
.date{color:var(--sub);font-size:.8rem;margin:0 0 14px}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.stamps i{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold)}
.stamps i.on{background:var(--gold)}
button{font:inherit;font-size:.95rem;color:var(--fg);background:transparent;border:1px solid var(--fg);border-radius:4px;padding:8px 20px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.tt{font-size:2.2rem;letter-spacing:.5em;padding-left:.5em;margin:0;color:#f0e9d2}
.ov button{color:#f0e9d2;border-color:#f0e9d2;letter-spacing:.2em}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btns button{padding:8px 14px;font-size:.9rem;letter-spacing:.08em}
.pw{min-height:180px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.ov p{margin:0 0 10px;color:#f0e9d2}
.ov .poem{color:#a9bbff;font-size:1.15rem}
.ov .date{color:#c8cde6}
.ov .stamps{justify-content:center}
.ov .stamps i{border-color:#d9b45a}.ov .stamps i.on{background:#d9b45a}
#lose,#end{background:rgba(10,12,30,.6)}
.panel{margin-top:16px}
.spr{display:flex;align-items:center;gap:10px;margin:8px 2px 0}
.spw{flex:1;height:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.spw i{display:block;height:100%;width:0;background:var(--gold)}
.rdy{border-color:var(--gold);color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.rdy{animation:pl 1s infinite}}
@keyframes pl{50%{opacity:.45}}
.opts{display:flex;flex-direction:column;gap:10px;width:84%}
.opt{text-align:left;padding:10px 14px;letter-spacing:.04em;font-size:.95rem;line-height:1.4;background:rgba(7,7,15,.55)}
.opt small{display:block;opacity:.8;font-size:.75rem;letter-spacing:0}
.ov .lvt{font-size:1.1rem;letter-spacing:.3em;margin:0 0 4px;color:#ffd45a}
#lv{background:rgba(10,12,30,.72)}
#cmp{background:#070816;overflow:hidden}
.cph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22}
.roll{position:absolute;left:0;right:0;top:0;text-align:center}
.roll.go{animation:rollup 20s linear forwards}
@keyframes rollup{from{transform:translateY(540px)}to{transform:translateY(-380px)}}
.roll p{margin:0;font-size:1.25rem;letter-spacing:.35em;line-height:3.4;color:#efe6cf}
.cend{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;transition:opacity 1.6s;pointer-events:none}
.cend.on{opacity:1;pointer-events:auto}
.cend.sh{justify-content:flex-start;padding-top:30px}
.the{font-size:1.6rem;letter-spacing:.4em;padding-left:.4em;color:#efe6cf;font-style:italic}
.csheet{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:0 20px}
.ebtn{position:absolute;right:10px;bottom:8px;padding:2px 10px;font-size:.8rem;opacity:.6}
.cskip{z-index:3}
.talk{display:flex;align-items:center;gap:12px;min-height:64px;margin-top:8px;padding:8px 12px;background:#141a3a;border:1px solid #3a4272;border-radius:6px;color:#f0e9d2;opacity:0;transition:opacity .25s}
.talk.on{opacity:1}
.talk img{width:48px;height:48px;flex:none;border-radius:4px;background:#0e1120}
.mu{padding:0 10px;font-size:.9rem;border-color:var(--line)}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="stage"><canvas id="c" width="360" height="480" aria-label="ゲーム画面"></canvas><div id="start" class="ov"><h1 class="tt">歌日記</h1><button id="go">start</button></div>
<div id="lose" class="ov hide"><p>倒されてしまいました</p><button id="retry">retry</button></div>
<div id="cmp" class="ov hide"><div id="cph" class="cph"></div><div id="roll" class="roll"><p>可惜夜の</p><p>爪が伸びれば</p><p>また切って</p><p>空に浮かべし</p><p>三日月の歌</p></div><button id="cskip" class="ebtn cskip">skip</button><div id="cend" class="cend"><div class="the">the end</div><div id="csheet" class="csheet hide"><div class="stamps" id="cst"></div><p id="ccount" class="date"></p><a id="cpoem" class="poem hide" target="_blank" rel="noopener"></a><button id="cback">タイトルに戻る</button></div></div></div>
<div id="lv" class="ov hide"><p class="lvt">LEVEL UP</p><div class="opts" id="opts"></div></div>
<div id="end" class="ov hide" aria-live="polite"><div class="pw"><div id="pRead" class="panel hide"><a id="poem" class="poem" target="_blank" rel="noopener"></a></div><div id="pStamp" class="panel hide"><div class="stamps" id="stamps"></div><p id="count" class="date"></p></div></div><div class="btns"><button id="bRead">read me</button><button id="bStamp">stamp card</button><button id="again">retry</button></div></div></div>
<div id="talk" class="talk" aria-live="polite"><img id="tf" alt="" width="48" height="48"><span id="tt2"></span></div>
<div class="hud"><span id="score"></span><button id="mu" class="mu" aria-label="音の切り替え">♪</button><span id="lives"></span></div>
<div class="spr"><button id="spb" class="mu" aria-label="SP攻撃">SP</button><div class="spw"><i id="spf"></i></div></div>

</main>
